version: 2

# The workflow pins actions to major-version tags (actions/checkout@v5), which
# is a mutable reference: whoever controls that tag controls what runs in CI.
# Dependabot is what makes the stricter alternative maintainable - it opens a PR
# when an action moves, so pinning to a commit SHA does not mean auditing
# upstream by hand forever.
#
# To pin: replace a tag with the commit SHA it points at and leave the tag in a
# trailing comment, e.g.
#
#     uses: actions/checkout@<sha>  # v5.0.0
#
# Dependabot reads that comment and keeps both in step.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
